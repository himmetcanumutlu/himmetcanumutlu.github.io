name: Preview branch

# Checks a preview branch on every push. When it passes, the main deploy
# workflow rebuilds the site and publishes this branch under /<branch>/.

on:
  push:
    branches: ['19-11-2026']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build with the preview base path
        run: BASE_PATH="/${GITHUB_REF_NAME}/" npm run build
